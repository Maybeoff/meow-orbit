<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Recorder</title>
<style>
  html,body{margin:0;padding:0;background:#0a0716;overflow:hidden}
  #wrap{position:relative}
  canvas{display:block}
  #frame{position:absolute;left:-9999px;top:0;width:450px;height:800px;border:0}
</style>
</head>
<body>
<div id="wrap"><canvas id="out"></canvas></div>
<iframe id="frame"></iframe>
<script>
(function () {
  var TAU = Math.PI * 2;
  function qs(k, d) {
    var m = new RegExp('[?&]' + k + '=([^&]+)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : d;
  }
  var W = Number(qs('w', 1280));
  var H = Number(qs('h', 720));
  var SECS = Number(qs('secs', 18));
  var NAME = qs('name', 'gameplay.mp4');
  var HORIZ = W > H;

  var out = document.getElementById('out');
  var ctx = out.getContext('2d');
  out.width = W; out.height = H;
  out.style.width = W + 'px'; out.style.height = H + 'px';

  var frame = document.getElementById('frame');
  var GW = 450, GH = 800;
  frame.style.width = GW + 'px';
  frame.style.height = GH + 'px';
  frame.src = qs('src', '/?nosdk=1&nohit=1');

  window.__recStatus = 'boot';

  var game = null, gameCanvas = null;

  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function stars() {
    var seed = 91;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    ctx.save();
    for (var i = 0; i < 120; i++) {
      var x = rnd() * W, y = rnd() * H, s = rnd() * 2.2 + 0.5;
      ctx.globalAlpha = 0.10 + rnd() * 0.55;
      ctx.fillStyle = i % 7 === 0 ? '#d9c8ff' : '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, s, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function layout() {
    var h = HORIZ ? H * 0.92 : H * 0.96;
    var w = h * (GW / GH);
    return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
  }

  function drawBg(L) {
    var g = ctx.createLinearGradient(0, 0, W * 0.4, H);
    g.addColorStop(0, '#150e34');
    g.addColorStop(0.55, '#0c0720');
    g.addColorStop(1, '#1b0b3a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // размытый увеличенный кадр игры как подложка
    if (gameCanvas) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      try { ctx.filter = 'blur(26px) saturate(1.1)'; } catch (e) {}
      var bw = W * 1.06, bh = bw * (GH / GW);
      ctx.drawImage(gameCanvas, (W - bw) / 2, (H - bh) / 2, bw, bh);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#0a0716';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    stars();
  }

  function text(t, x, y, size, color, weight, align) {
    ctx.save();
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.font = (weight || 800) + ' ' + size + 'px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(139,92,255,.55)';
    ctx.shadowBlur = size * 0.35;
    ctx.fillText(t, x, y);
    ctx.restore();
  }

  function drawLogo(x, y, size, align) {
    ctx.save();
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 ' + size + 'px "Segoe UI", system-ui, sans-serif';
    var parts = [
      { s: qs('logo1', 'МЯУ'), col: null },
      { s: '·', col: '#ff5fa2' },
      { s: qs('logo2', 'ОРБИТА'), col: null }
    ];
    var total = 0;
    parts.forEach(function (p) { total += ctx.measureText(p.s).width; });
    var startX = align === 'center' ? x - total / 2 : x;
    if (align === 'right') startX = x - total;
    var g = ctx.createLinearGradient(0, y - size * 0.6, 0, y + size * 0.6);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.55, '#dbd0ff');
    g.addColorStop(1, '#a98bff');
    var cx = startX;
    parts.forEach(function (p) {
      var w = ctx.measureText(p.s).width;
      ctx.shadowColor = p.col ? 'rgba(255,95,162,.95)' : 'rgba(139,92,255,.9)';
      ctx.shadowBlur = size * 0.5;
      ctx.fillStyle = p.col || g;
      ctx.fillText(p.s, cx, y);
      cx += w;
    });
    ctx.restore();
    return total;
  }

  function drawFrame() {
    var L = layout();
    drawBg(L);

    // рамка/свечение вокруг игрового кадра
    if (gameCanvas) {
      ctx.save();
      ctx.shadowColor = 'rgba(139,92,255,.55)';
      ctx.shadowBlur = 60;
      rr(ctx, L.x, L.y, L.w, L.h, 30);
      ctx.fillStyle = '#0a0716';
      ctx.fill();
      ctx.restore();

      ctx.save();
      rr(ctx, L.x, L.y, L.w, L.h, 30);
      ctx.clip();
      ctx.drawImage(gameCanvas, 0, 0, GW, GH, L.x, L.y, L.w, L.h);
      ctx.restore();

      ctx.save();
      rr(ctx, L.x, L.y, L.w, L.h, 30);
      ctx.strokeStyle = 'rgba(190,165,255,.35)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    if (HORIZ) {
      var pad = W * 0.045;
      drawLogo(pad, H * 0.135, Math.min(W, H) * 0.085, 'left');
      text('Космический кот, рыбки и астероиды', pad, H * 0.215, Math.min(W, H) * 0.030, 'rgba(226,215,255,.92)', 700, 'left');
      text('ОДИН ТАП · БЕСКОНЕЧНЫЙ ЗАБЕГ', pad, H * 0.80, Math.min(W, H) * 0.026, '#ffd166', 900, 'left');
      text('щит · магнит · замедление', pad, H * 0.865, Math.min(W, H) * 0.022, 'rgba(180,165,230,.8)', 600, 'left');
    } else {
      var pad2 = W * 0.06;
      drawLogo(W / 2, H * 0.055, W * 0.075, 'center');
      text('ОДИН ТАП · БЕСКОНЕЧНЫЙ ЗАБЕГ', W / 2, H * 0.955, W * 0.032, '#ffd166', 900, 'center');
    }
  }

  function installBot(win) {
    var App = win.App;
    function clear(lane) {
      var min = 9;
      for (var i = 0; i < App.hazards.length; i++) {
        var h = App.hazards[i];
        if (h.lane !== lane) continue;
        var lim = (App.catR * 5.5 + h.size * 4.5) / App.orbits[lane];
        for (var tt = 0; tt < 2.2; tt += 0.04) {
          var ca = App.cat.ang + App.omega * tt, ha = h.ang + h.spd * tt;
          var da = Math.abs(((ca - ha + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
          if (da < lim) { if (tt < min) min = tt; break; }
        }
      }
      return min;
    }
    win.__botOn = true;
    win.__bot = setInterval(function () {
      if (!win.__botOn || App.mode !== 'playing') return;
      var cur = App.cat.targetLane, c = clear(cur);
      if (c < 0.42) {
        var best = -1, bt = -1;
        for (var l = 0; l < App.maxLanes; l++) {
          if (l === cur) continue;
          var t = clear(l);
          if (t > bt) { bt = t; best = l; }
        }
        if (best >= 0 && bt > c + 0.2) {
          for (var k = 0; k < 4 && App.cat.targetLane !== best; k++) App.switchLane();
        }
      }
    }, 35);

    // иногда собираем бонусы принудительно, чтобы в кадр попадали эффекты
    setTimeout(function () {
      try {
        App.takePower({ type: 'shield', ang: App.cat.ang + 0.9, r: App.cat.r, size: 14 });
      } catch (e) {}
    }, 3000);
    setTimeout(function () {
      try {
        App.takePower({ type: 'magnet', ang: App.cat.ang + 0.9, r: App.cat.r, size: 14 });
      } catch (e) {}
    }, 9000);
  }

  function start() {
    var win = frame.contentWindow;
    if (!win || !win.App || !win.App.SKINS || !win.document.getElementById('game')) {
      return false;
    }
    game = win.App;
    gameCanvas = win.document.getElementById('game');
    win.UI.play();
    win.App.tutorial = false;
    win.App.god = true;
    win.App.score = 1150;
    installBot(win);

    var mime = 'video/mp4;codecs=avc1.42E01E';
    if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';
    var stream = out.captureStream(30);
    var rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 9000000 });
    var chunks = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function () {
      window.__recStatus = 'encoding';
      var blob = new Blob(chunks, { type: 'video/mp4' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = NAME;
      document.body.appendChild(a);
      a.click();
      window.__recSize = blob.size;
      window.__recStatus = 'done';
    };
    rec.start();

    var t0 = performance.now();
    (function loop() {
      drawFrame();
      var el = (performance.now() - t0) / 1000;
      if (el < SECS) requestAnimationFrame(loop);
      else {
        drawFrame();
        window.__recStatus = 'stopping';
        rec.stop();
        if (win.__bot) clearInterval(win.__bot);
      }
    })();
    window.__recStatus = 'recording';
    return true;
  }

  var tries = 0;
  (function wait() {
    var ok = false;
    try { ok = start(); } catch (e) { window.__recError = String(e); }
    if (ok) return;
    if (++tries > 400) { window.__recStatus = 'timeout'; return; }
    setTimeout(wait, 50);
  })();
})();
</script>
</body>
</html>
